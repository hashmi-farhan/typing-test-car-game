<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WPM Grand Prix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#eceae4;--panel:#fbfaf7;--ink:#14171c;--mute:#666b75;--line:#d6d2c8;--acc:#0e9f90;--amb:#c77800;--ok:#0b8a55;--okbg:rgba(11,138,85,.12);--bad:#d3304a;--badbg:rgba(211,48,74,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090b0f;--panel:#12161d;--ink:#eee9dd;--mute:#8b909b;--line:#242a34;--acc:#2fd6c4;--amb:#ffb21f;--ok:#46e0a0;--okbg:rgba(70,224,160,.13);--bad:#ff6178;--badbg:rgba(255,97,120,.2);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090b0f;--panel:#12161d;--ink:#eee9dd;--mute:#8b909b;--line:#242a34;--acc:#2fd6c4;--amb:#ffb21f;--ok:#46e0a0;--okbg:rgba(70,224,160,.13);--bad:#ff6178;--badbg:rgba(255,97,120,.2);color-scheme:dark}
*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:30px;margin:0;letter-spacing:.5px}.hint{color:var(--mute);font-size:17px}
.tools{display:flex;gap:10px;align-items:center}
.wal{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 14px 4px 6px;font-size:22px;font-weight:700}
.wal i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#e39b00);box-shadow:inset 0 0 0 3px #b87400}
.lv{display:flex;flex-direction:column;gap:3px;font-size:18px;font-weight:700;min-width:70px}.lv i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.lv b{display:block;height:100%;width:0;background:var(--acc)}.lane .gm{background:var(--mute);opacity:.55;top:0;height:22px;width:26px;margin-left:-13px}
.btn{font:700 17px "Saira Condensed",sans-serif;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn:focus-visible,.res button:focus-visible{outline:2px solid var(--amb);outline-offset:2px}.btn:disabled{opacity:.45;cursor:not-allowed}
.scene{position:relative;border-radius:10px;overflow:hidden;background:#0b0e13;border:1px solid var(--line)}
canvas{display:block}#cv{width:100%;height:290px}
.hud{position:absolute;left:18px;top:12px;color:#f3efe4;text-shadow:0 1px 10px #000a;pointer-events:none}
.hud b{font-size:76px;line-height:.9;display:block;font-variant-numeric:tabular-nums}.hud span{font-size:18px;opacity:.75}
.stats{position:absolute;right:16px;top:14px;display:flex;gap:22px;color:#f3efe4;text-align:right;text-shadow:0 1px 8px #000a}
.stats b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}.stats span{font-size:15px;opacity:.7}
.rev{margin:24px 0 4px;position:relative;height:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.rev i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--amb) 70%,var(--bad));width:0}
.rev u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.rev u em{position:absolute;top:-19px;left:-18px;font:500 13px "Saira Condensed",sans-serif;font-style:normal;white-space:nowrap;color:var(--mute)}
.lane{position:relative;height:22px;margin:24px 0 14px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.lane i{position:absolute;inset:0 auto 0 0;background:var(--okbg);width:0}
.lane s{position:absolute;right:0;top:0;bottom:0;width:20px;background:conic-gradient(var(--ink) 25%,var(--panel) 0 50%,var(--ink) 0 75%,var(--panel) 0) 0 0/10px 10px}
.lane b{position:absolute;top:-6px;height:32px;width:34px;margin-left:-17px;left:0;background:var(--acc);clip-path:polygon(0 30%,35% 30%,50% 0,80% 0,100% 45%,100% 100%,0 100%)}
.type{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;cursor:text}
.type:focus-within{border-color:var(--acc)}
#txt{font:500 20px/1.85 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:var(--mute)}
#txt .ok{color:var(--ok)}#txt .bad{color:var(--bad);background:var(--badbg);border-radius:2px}
#txt .cur{box-shadow:inset 2px 0 var(--acc);animation:bl 1s steps(1) infinite}@keyframes bl{50%{box-shadow:none}}
#ta{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;resize:none;border:0;cursor:text}
.msg{margin-top:10px;color:var(--mute);font-size:18px}
.res{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b0e13e0;color:#f3efe4;text-align:center}
.res.on{display:flex}.res h2{margin:0;font-size:46px}.res p{margin:6px 0;font-size:21px}.res .co{color:#ffc53d;font-size:30px;font-weight:700}
.res button{margin-top:12px;font:700 20px "Saira Condensed",sans-serif;background:#2fd6c4;color:#06201d;border:0;border-radius:6px;padding:9px 22px;cursor:pointer}
section{margin-top:26px}h3{margin:0 0 10px;font-size:24px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}.tabs .btn.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card.eq{border-color:var(--acc)}.card canvas,.sw{width:100%;height:76px;border-radius:6px;background:#0b0e13}
.card b{font-size:22px}.card p{margin:0;color:var(--mute);font-size:17px;flex:1}
.row{display:grid;grid-template-columns:44px 1fr 1fr 1fr 90px;gap:8px;padding:9px 4px;border-top:1px solid var(--line);font-size:20px;font-variant-numeric:tabular-nums}
.row.best{color:var(--amb)}.row small{font-size:16px;color:var(--mute)}.empty{color:var(--mute);font-size:18px}
@media(max-width:620px){#cv{height:220px}.hud b{font-size:52px}.stats{gap:12px}.stats b{font-size:22px}#txt{font-size:17px}.row{grid-template-columns:34px 1fr 1fr 1fr}.row span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){#txt .cur{animation:none}}
</style></head><body><main>
<header><div><h1>WPM Grand Prix</h1><div class="hint">Type the line exactly. Faster typing means a faster car. Every race pays coins.</div></div>
<div class="tools"><div class="lv"><span id="lv">Lv 1</span><i><b id="lvb"></b></i></div><div class="wal" title="Coins"><i></i><span id="coins">0</span></div><button class="btn" id="snd">Sound on</button></div></header>
<div class="scene"><canvas id="cv"></canvas>
<div class="hud"><b id="kmh">0</b><span id="kl">km/h</span></div>
<div class="stats"><div><b id="wpm">0</b><span>WPM</span></div><div><b id="acc">100%</b><span>accuracy</span></div><div><b id="cmb">0</b><span>combo</span></div><div><b id="tm">0.0s</b><span>time</span></div></div>
<div class="res" id="res"><div><h2 id="rt"></h2><p id="r1"></p><p id="r2"></p><p class="co" id="r3"></p><button id="again">Race again (Enter)</button></div></div></div>
<div class="rev"><i id="bar"></i><u id="mLast" hidden><em>last top</em></u><u id="mBest" hidden><em>best</em></u></div>
<div class="lane"><i id="pf"></i><b id="gc" class="gm" hidden></b><b id="pc"></b><s></s></div>
<div class="type" id="box"><div id="txt"></div><textarea id="ta" aria-label="Type the text shown" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
<div class="msg" id="msg"></div>
<section><h3>Garage and store <span class="tabs" id="tabs"><button class="btn on" data-t="cars">Cars</button><button class="btn" data-t="routes">Routes</button><button class="btn" data-t="perks">Perks</button></span></h3><div class="grid" id="shop"></div></section>
<section><h3>This session <button class="btn" id="clr">Clear log</button></h3><div id="log"></div></section>
</main>
<script>
(()=>{
const TEXTS=[
"hey there who r u, tell me r u gonna acheive anything great in this damn world or just u r gonna chase cheap and fake dopamines and always lie in your comfort",
"dont u dare...u have to acheive great things u cant just sit around and do nothing there r lots of work u have to do and dont limit yourself",
"always remember u r not a victim u r fighter who is gonna kill it so dont u dare to give up on your dreams and start grinding",
"you sacrificed many things to acheive this little things so always remember your goals...",
"it does not matter how do u feel about your life just stick to your work and still not something stimulating u feel then listent to chatpate songs..haha",
"what is your hobbies:my hobbies are i love to study fascinating stuff like AI,neuroscience ,games,movies,fitness,extremely great capable ,study,coding, want to do chaotic things with my old frnds ,enjoying time with my old bhailog",
"i will try my best to acheive every thing i have dreamt of it.",
"which was the turning point in your life , my turning point was to start watching great anime like naruto which taught me many things that i would may be never able to learn for next some years by my real life.",
"when people asks me about why i watch some cartoon then i just smirked on them and i think he/she not need to undestand what they r missing.",
"every great anime characters teaches us that we should not never give up even though how much your dreams feel like it would never be possible still beleive in yourself and just do your work one day everything is gonna great for you and your all problems will be fixed out ."];
const CARS={
volt:{n:'Volt S',p:0,t:'Pearl electric sedan, silent and smooth.',c:'#e9ecf1',g:'#10161d',r:15,aero:1,pts:[[-95,-10],[-95,-27],[-76,-33],[-48,-45],[-8,-53],[26,-50],[54,-33],[90,-28],[100,-18],[100,-10]],gl:[[-52,-37],[-8,-49],[24,-47],[44,-34]]},
apex:{n:'Apex GT',p:300,t:'Low-slung sports coupe in teal.',c:'#19c3b1',g:'#071a1c',r:15,pts:[[-96,-10],[-96,-26],[-62,-31],[-26,-46],[8,-48],[46,-31],[96,-24],[100,-14],[100,-10]],gl:[[-34,-33],[-28,-38],[6,-44],[34,-33]]},
slab:{n:'Slab X',p:700,t:'Angular steel pickup. Looks like nothing else.',c:'#aeb4bf',g:'#0b0e12',r:17,pts:[[-98,-10],[-98,-42],[-30,-60],[96,-27],[100,-12]],gl:[[-56,-35],[-56,-47],[-30,-56],[52,-35]]},
hyper:{n:'Hyper One',p:1500,t:'Track-day hypercar with a turbo flame.',c:'#ff6a1a',g:'#1b0f08',r:14,pts:[[-96,-10],[-96,-22],[-64,-28],[-24,-42],[10,-45],[52,-28],[98,-20],[100,-10]],gl:[[-34,-30],[-28,-34],[8,-41],[40,-30]]}};
const ROUTES={
city:{n:'Night City',p:0,t:'Neon towers and lit windows.',sky:['#06080c','#121823','#3b2512'],f:'#161c27',nr:'#0f131b',sh:'r',win:1,rd:['#1b1f27','#0e1014'],ln:'#f3efe4'},
desert:{n:'Desert Highway',p:250,t:'Long dunes under a burning sunset.',sky:['#2b1608','#8a4a1a','#f0a24a'],f:'#8a4a1f',nr:'#5a2a12',sh:'d',rd:['#3a3029','#1d1814'],ln:'#ffd27a'},
snow:{n:'Snow Pass',p:500,t:'Mountain road in a snowfall.',sky:['#0a1626','#2a4561','#9fb8cc'],f:'#51708b',nr:'#dfe8f0',sh:'m',rd:['#3a424c','#1b2027'],ln:'#ffffff',snow:1}};
const PERKS={boost:{n:'Coin boost x1.5',p:500,t:'Earn 50% more coins on every race, forever.'}};
const $=s=>document.getElementById(s),cv=$('cv'),cx=cv.getContext('2d'),ta=$('ta');
const MAXK=400,KPW=3.5;
let W,H,st='ready',target='',cur='',t0=0,keys=[],errs=0,tot=0,spd=0,tp=0,off=0,wang=0,last=-1,ts=0,spans=[],combo=0,trk=[],ghost=null,tab='cars',far,near,au,osc,gn,mute=false;
let hist=[];try{hist=JSON.parse(sessionStorage.getItem('wpmgp')||'[]')}catch(e){}
let S={coins:0,xp:0,gh:{},day:'',own:['volt','city'],car:'volt',route:'city'};
try{Object.assign(S,JSON.parse(localStorage.getItem('wpmgp2')||'{}'))}catch(e){}
const save=()=>{try{sessionStorage.setItem('wpmgp',JSON.stringify(hist))}catch(e){}},saveS=()=>{try{localStorage.setItem('wpmgp2',JSON.stringify(S))}catch(e){}};
function fit(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);
const mk=(n,a,b,c,d)=>{let r=[],x=0;for(let i=0;i<n;i++){const w=a+Math.random()*(b-a);r.push({x,w,h:c+Math.random()*(d-c),i});x+=w+(a>100?0:5)}return{r,len:x}};
function scenery(){const s=ROUTES[S.route].sh;if(s==='r'){far=mk(40,30,70,40,110);near=mk(30,50,110,60,170)}else if(s==='d'){far=mk(14,200,380,40,90);near=mk(12,240,420,20,60)}else{far=mk(18,140,280,70,160);near=mk(14,180,320,40,110)}}
function layer(L,f,col,win,y0,sh){cx.fillStyle=col;const base=-((off*f)%L.len);for(let k=0;k<3;k++)for(const b of L.r){const x=base+k*L.len+b.x;if(x>W||x+b.w<0)continue;
if(sh==='r'){cx.fillRect(x,y0-b.h,b.w,b.h);if(win)for(let c=0;c<b.w-12;c+=12)for(let r=10;r<b.h-8;r+=14)if((b.i*7+c+r)%5<1){cx.fillStyle='#ffb21f55';cx.fillRect(x+6+c,y0-b.h+r,4,6);cx.fillStyle=col}}
else if(sh==='m'){cx.beginPath();cx.moveTo(x,y0);cx.lineTo(x+b.w/2,y0-b.h);cx.lineTo(x+b.w,y0);cx.fill()}
else{cx.beginPath();cx.ellipse(x+b.w/2,y0,b.w/2,b.h,0,Math.PI,0);cx.fill()}}}
const poly=(g,p,col,lw)=>{g.fillStyle=col;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();if(lw){g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.stroke()}};
function drawCar(k,g,x,y,s,ang,fl){const c=CARS[k];g.save();g.translate(x,y);g.scale(s,s);
g.fillStyle='#0008';g.beginPath();g.ellipse(0,2,100,7,0,0,7);g.fill();
if(fl>0&&k!=='volt'){const l=fl,gr=g.createLinearGradient(-96,0,-96-l,0);gr.addColorStop(0,'#ffb21f');gr.addColorStop(1,'#ffb21f00');g.fillStyle=gr;g.beginPath();g.moveTo(-96,-20);g.lineTo(-96-l,-15);g.lineTo(-96,-10);g.fill()}
poly(g,c.pts,c.c,5);poly(g,c.gl,c.g,3);
g.fillStyle='#ff3b4e';g.fillRect(-98,k==='volt'?-27:-24,4,k==='volt'?4:6);g.fillStyle='#fff6d6';g.fillRect(94,-22,7,4);
for(const wx of[-56,58]){g.save();g.translate(wx,-14);g.fillStyle='#05070a';g.beginPath();g.arc(0,0,c.r+3,0,7);g.fill();g.fillStyle='#14171c';g.beginPath();g.arc(0,0,c.r,0,7);g.fill();
if(c.aero){g.fillStyle='#cfd3da';g.beginPath();g.arc(0,0,c.r*.66,0,7);g.fill();g.fillStyle='#8d939d';g.fillRect(-1,-c.r*.5,2,c.r*.5)}
else{g.rotate(ang);g.strokeStyle='#b9bec8';g.lineWidth=2.5;for(let i=0;i<5;i++){g.rotate(1.2566);g.beginPath();g.moveTo(0,0);g.lineTo(c.r*.7,0);g.stroke()}}g.restore()}
g.restore()}
function draw(now){const R=ROUTES[S.route],y0=H*.64,g=cx.createLinearGradient(0,0,0,y0);g.addColorStop(0,R.sky[0]);g.addColorStop(.7,R.sky[1]);g.addColorStop(1,R.sky[2]);cx.fillStyle=g;cx.fillRect(0,0,W,H);
layer(far,.1,R.f,0,y0,R.sh);layer(near,.3,R.nr,R.win,y0,R.sh);
const rg=cx.createLinearGradient(0,y0,0,H);rg.addColorStop(0,R.rd[0]);rg.addColorStop(1,R.rd[1]);cx.fillStyle=rg;cx.fillRect(0,y0,W,H-y0);
cx.fillStyle=R.ln+'66';cx.fillRect(0,y0,W,2);
const dy=y0+(H-y0)*.55;cx.fillStyle=R.ln+'aa';for(let x=-(off%120);x<W;x+=120)cx.fillRect(x,dy,60,4);
for(let x=-(off%420)+200;x<W+50;x+=420){cx.fillStyle='#2a303b';cx.fillRect(x,y0-125,4,125);cx.fillRect(x,y0-125,26,4);const lg=cx.createRadialGradient(x+26,y0-118,0,x+26,y0-118,60);lg.addColorStop(0,R.snow?'#cfe6ff77':'#ffb21f88');lg.addColorStop(1,'#0000');cx.fillStyle=lg;cx.fillRect(x-34,y0-180,120,120)}
if(R.snow){cx.fillStyle='#ffffffb0';for(let i=0;i<60;i++){const x=(((i*131-off*.6+now*.03*(i%5))%W)+W)%W,y=(i*53+now*(.05+(i%4)*.03))%H;cx.fillRect(x,y,2,2)}}
if(spd>120){cx.strokeStyle=(combo>=25&&st==='run')?'rgba(120,230,255,.35)':'rgba(243,239,228,'+Math.min(.2,spd/2000)+')';cx.lineWidth=1.5;for(let i=0;i<14;i++){const x=((i*173-off*1.8)%(W+300)+W+300)%(W+300)-100,y=y0-20+(i*53)%(H-y0+20);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+20+spd*.45,y);cx.stroke()}}
const s=H/300,px=W*.2+Math.min(spd/MAXK,1)*W*.14,py=y0+(H-y0)*.8+Math.sin(now/80)*(spd/MAXK)*1.5;
const bl=cx.createLinearGradient(px+98*s,0,px+260*s,0);bl.addColorStop(0,'#fff2c055');bl.addColorStop(1,'#fff2c000');cx.fillStyle=bl;cx.beginPath();cx.moveTo(px+96*s,py-22*s);cx.lineTo(px+260*s,py-40*s);cx.lineTo(px+260*s,py+4*s);cx.fill();
drawCar(S.car,cx,px,py,s,wang,spd>250?(spd-250)*.28+Math.random()*10:0);
if(st==='ready'){cx.fillStyle='#f3efe4';cx.font='700 24px "Saira Condensed",sans-serif';cx.textAlign='center';cx.fillText('Click here, then type the first letter to start the engine',W/2,H*.2+70,W-40);cx.textAlign='left'}}
function paint(){for(let i=0;i<spans.length;i++){const c=i<cur.length?(cur[i]===target[i]?'ok':'bad'):'';spans[i].className=c+(i===cur.length?' cur':'')}}
function newRace(){let i;do{i=Math.floor(Math.random()*TEXTS.length)}while(i===last);last=i;target=TEXTS[i];cur='';ta.value='';keys=[];errs=tot=0;tp=0;combo=0;trk=[];ghost=S.gh&&S.gh[last]?S.gh[last].p:null;st='ready';
$('txt').innerHTML='';spans=[...target].map(ch=>{const s=document.createElement('span');s.textContent=ch;$('txt').appendChild(s);return s});paint();
$('res').classList.remove('on');$('msg').textContent='Esc loads a new line. Backspace fixes mistakes.';ta.focus()}
ta.addEventListener('paste',e=>e.preventDefault());
ta.addEventListener('input',()=>{if(st==='done'){ta.value=cur;return}
let v=ta.value.replace(/\n/g,'').slice(0,target.length);if(v!==ta.value)ta.value=v;
if(st==='ready'){st='run';t0=performance.now();$('msg').textContent='Green is correct, red must be fixed.'}
const n=performance.now();for(let i=cur.length;i<v.length;i++){tot++;if(v[i]!==target[i]){errs++;combo=0}else combo++;keys.push(n)}
cur=v;paint();if(cur===target)finish()});
const ok=()=>{let c=0;for(let i=0;i<cur.length;i++)if(cur[i]===target[i])c++;return c};
function finish(){st='done';const el=(performance.now()-t0)/1000,w=Math.round(target.length/5/(Math.max(el,1)/60)),a=Math.round((tot-errs)/Math.max(tot,1)*100),t=Math.round(tp);
const prev=hist.length?hist[hist.length-1].top:null,best=hist.length?Math.max(...hist.map(h=>h.top)):0,rec=prev!==null&&t>best;
const day=new Date().toDateString(),db=S.day!==day?50:0,cl=a===100?20:0;const co=Math.round((Math.round(w*.8*(a/100)**2)+Math.round(t/20)+(rec?30:0)+cl)*(S.own.includes('boost')?1.5:1))+db;S.day=day;
hist.push({w,top:t,a,el:+el.toFixed(1)});save();S.coins+=co;S.xp=(S.xp||0)+co;trk.push(target.length);if(!S.gh)S.gh={};if(!S.gh[last]||el<S.gh[last].t)S.gh[last]={t:+el.toFixed(2),p:trk};saveS();
$('rt').textContent=prev===null?'First lap set':rec?'New top speed record':t>prev?'Faster than last run':'Finish line';
$('r1').textContent=w+' WPM, '+t+' km/h top speed, '+a+'% accuracy';
$('r2').textContent=prev===null?'This is now your mark to beat.':(t>=prev?'+':'')+(t-prev)+' km/h against your last run ('+prev+').';
$('r3').textContent='+'+co+' coins'+(rec?', record bonus':'')+(cl?', clean lap':'')+(db?', daily bonus':'');
$('res').classList.add('on');renderLog();renderShop();$('again').focus()}
function renderLog(){const b=hist.length?Math.max(...hist.map(h=>h.top)):0;
$('log').innerHTML=hist.length?hist.map((h,i)=>'<div class="row'+(h.top===b?' best':'')+'"><span>#'+(i+1)+'</span><span>'+h.w+' <small>WPM</small></span><span>'+h.top+' <small>km/h top</small></span><span>'+h.a+'% <small>acc</small></span><span>'+h.el+'s</span></div>').reverse().join(''):'<div class="empty">No runs yet. Finish a line and it shows up here until you close this tab.</div>';
const p=hist.length?hist[hist.length-1].top:0;for(const[id,v]of[['mLast',p],['mBest',b]]){const e=$(id);e.hidden=!v;e.style.left=Math.min(v/MAXK,1)*100+'%'}

function renderShop(){$('coins').textContent=S.coins;const xp=S.xp||0,L=Math.floor(Math.sqrt(xp/60))+1,lo=60*(L-1)**2,hi=60*L*L;$('lv').textContent='Lv '+L;$('lvb').style.width=Math.round((xp-lo)/(hi-lo)*100)+'%';const src=tab==='cars'?CARS:tab==='routes'?ROUTES:PERKS;

return '<div class="card'+(eq&&tab!=='perks'?' eq':'')+'">'+pv+'<b>'+it.n+'</b><p>'+it.t+'</p>'+btn+'</div>'}).join('');
if(tab==='cars')for(const k in CARS){const c=$('pv_'+k).getContext('2d');c.fillStyle='#10141b';c.fillRect(0,0,240,84);c.fillStyle='#1c2029';c.fillRect(0,66,240,18);drawCar(k,c,118,70,1.05,0,0)}}
$('shop').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.a)return;const k=b.dataset.k,it=(tab==='cars'?CARS:tab==='routes'?ROUTES:PERKS)[k];
if(b.dataset.a==='buy'&&S.coins>=it.p){S.coins-=it.p;S.own.push(k)}else if(b.dataset.a==='eq'){}else if(b.dataset.a==='buy')return;
if(tab==='cars')S.car=k;if(tab==='routes'){S.route=k;scenery()}saveS();renderShop();ta.focus()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;for(const x of $('tabs').children)x.classList.toggle('on',x===b);renderShop()});

function audio(){if(au)return;try{au=new(window.AudioContext||window.webkitAudioContext)();osc=au.createOscillator();gn=au.createGain();osc.type='triangle';gn.gain.value=0;osc.connect(gn);gn.connect(au.destination);osc.start()}catch(e){au=null}}
addEventListener('keydown',e=>{audio();if(au&&au.state==='suspended')au.resume();if(document.activeElement!==ta&&e.key.length===1&&!e.ctrlKey&&!e.metaKey)ta.focus();if(e.key==='Escape')newRace();else if(e.key==='Enter'){if(document.activeElement===ta||st==='done')e.preventDefault();if(st==='done')newRace()}});
$('box').addEventListener('click',()=>ta.focus());cv.addEventListener('click',()=>ta.focus());
function frame(now){const dt=Math.min((now-ts)/1000||0,.05);ts=now;
while(keys.length&&keys[0]<now-3000)keys.shift();
spd+=((st==='run'?keys.length*4*KPW*(combo>=25?1.12:1):0)-spd)*Math.min(1,dt*(st==='run'?2.4:1.2));if(spd<.5)spd=0;
if(st==='run')tp=Math.max(tp,spd);
off+=spd*3.2*dt;wang+=spd*.06*dt;
if(au){osc.frequency.value=(S.car==='volt'?260:70)+spd*(S.car==='volt'?2.2:.9);gn.gain.value=mute||st!=='run'?0:Math.min(.045,.006+spd/9000)}
const el=st==='run'?(now-t0)/1000:0;
if(st==='run'){$('wpm').textContent=Math.round(ok()/5/(Math.max(el,1)/60));$('acc').textContent=Math.round((tot-errs)/Math.max(tot,1)*100)+'%';$('tm').textContent=el.toFixed(1)+'s'}
if(st==='ready'){$('wpm').textContent=0;$('acc').textContent='100%';$('tm').textContent='0.0s'}

if(st==='run'){const q=Math.floor((now-t0)/250);while(trk.length<=q)trk.push(ok());if(ghost){const gp=ghost[Math.min(q,ghost.length-1)],d=ok()-gp;$('gc').hidden=false;$('gc').style.left=Math.min(gp/target.length*100,96)+'%';$('msg').textContent=(d>=0?'Ahead of your best by ':'Behind your best by ')+Math.abs(d)+' characters.'}else $('gc').hidden=true}else if(st==='ready')$('gc').hidden=true;
draw(now);requestAnimationFrame(frame)}
fit();scenery();renderLog();renderShop();newRace();requestAnimationFrame(frame);
